workflows:
  ios-workflow:
    name: iOS Build and Deploy (Production)
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    integrations:
      app_store_connect: bar_fest_apple_api
    max_build_duration: 120
    instance_type: mac_mini_m1
    environment:
      groups:
        - bar_fest_distribution
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.barfest.app
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.barfest.app"
        APP_ID: "6759994494"
        # VITE_MAPKIT_TOKEN: inlines at `npm run build` for MapKit JS (web). The Capacitor
        # iOS app uses native MKMapView and does not require this token for the map screen.
        # Set in Codemagic if the same build must authorize MapKit JS (e.g. web assets).
      node: 22.18.0
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: |
          npm ci
      - name: Build web app
        script: |
          if [ -z "$VITE_MAPKIT_TOKEN" ]; then echo "Note: VITE_MAPKIT_TOKEN is not set — native iOS map still works; MapKit JS (web) needs a token at runtime."; fi
          npm run build
      # Regenerates ios/App/App/capacitor.config.json + Package.swift; required so native plugins match JS.
      - name: Sync Capacitor iOS
        script: |
          npx cap sync ios
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles
      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      email:
        recipients:
          - user@example.com # Update with your email
        notify:
          success: true
          failure: false
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false

  ios-test-workflow:
    name: iOS Build and Deploy (Bar Fest Test)
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: Test
          include: true
    integrations:
      app_store_connect: bar_fest_test_apple_api
    max_build_duration: 120
    instance_type: mac_mini_m1
    environment:
      groups:
        - bar_fest_distribution
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.barfest.app.test
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.barfest.app.test"
        APP_ID: "6776871909"
      node: 22.18.0
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: |
          npm ci
      - name: Apply test Capacitor config
        script: |
          node scripts/apply-capacitor-config.mjs test
      - name: Build web app
        script: |
          if [ -z "$VITE_MAPKIT_TOKEN" ]; then echo "Note: VITE_MAPKIT_TOKEN is not set — native iOS map still works; MapKit JS (web) needs a token at runtime."; fi
          npm run build
      - name: Sync Capacitor iOS
        script: |
          npx cap sync ios
      - name: Diagnose iOS signing
        script: |
          chmod +x scripts/diagnose-ios-signing.sh
          ./scripts/diagnose-ios-signing.sh
      - name: Align Xcode bundle ID with workflow
        script: |
          chmod +x scripts/sync-ios-bundle-id.sh
          ./scripts/sync-ios-bundle-id.sh
      - name: Set up code signing settings on Xcode project
        script: |
          set -x
          xcode-project use-profiles
      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      email:
        recipients:
          - user@example.com # Update with your email
        notify:
          success: true
          failure: false
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false

  # Native SwiftUI shell (Phase 1+) — no Capacitor / Vite web bundle.
  native-ios-workflow:
    name: Native iOS BarFest (TestFlight)
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: native-ios
          include: true
    integrations:
      app_store_connect: bar_fest_apple_api
    max_build_duration: 120
    instance_type: mac_mini_m1
    environment:
      groups:
        - bar_fest_distribution
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.barfest.app
      vars:
        XCODE_PROJECT: "native/ios/BarFest/BarFest.xcodeproj"
        XCODE_SCHEME: "BarFest"
        BUNDLE_ID: "com.barfest.app"
      xcode: latest
    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen || true
      - name: Generate Xcode project
        script: |
          cd native/ios/BarFest
          xcodegen generate
          # XcodeGen rewrites Info.plist and forces CFBundleVersion=1 — restore git version.
          git checkout HEAD -- BarFest/Info.plist
      - name: Restore Info.plist versions + inject Supabase secrets
        script: |
          PLIST=native/ios/BarFest/BarFest/Info.plist
          # Hardcoded marketing / build (bump these in Info.plist + here before each TestFlight upload).
          # Keep in sync with BarFest/Info.plist CFBundleShortVersionString / CFBundleVersion.
          NATIVE_MARKETING_VERSION=1.0.1
          NATIVE_BUILD_NUMBER=33
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${NATIVE_MARKETING_VERSION}" "$PLIST" || \
            /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string ${NATIVE_MARKETING_VERSION}" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${NATIVE_BUILD_NUMBER}" "$PLIST" || \
            /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string ${NATIVE_BUILD_NUMBER}" "$PLIST"
          # HTTPS-only / no custom crypto — skip ASC export-compliance questionnaire on upload
          /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption bool false" "$PLIST" || \
            /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST"
          # Same VITE_* names as the React / Vercel apps (Codemagic env group)
          /usr/libexec/PlistBuddy -c "Set :VITE_SUPABASE_URL ${VITE_SUPABASE_URL}" "$PLIST" || \
            /usr/libexec/PlistBuddy -c "Add :VITE_SUPABASE_URL string ${VITE_SUPABASE_URL}" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :VITE_SUPABASE_PUBLISHABLE_KEY ${VITE_SUPABASE_PUBLISHABLE_KEY}" "$PLIST" || \
            /usr/libexec/PlistBuddy -c "Add :VITE_SUPABASE_PUBLISHABLE_KEY string ${VITE_SUPABASE_PUBLISHABLE_KEY}" "$PLIST"
          echo "Info.plist CFBundleShortVersionString=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST")"
          echo "Info.plist CFBundleVersion=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$PLIST")"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$PLIST")" = "${NATIVE_BUILD_NUMBER}"
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles
      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false

  # Native SwiftUI → Bar Fest Test (com.barfest.app.test). Prefer Test branch.
  native-ios-test-workflow:
    name: Native iOS BarFest Test (TestFlight)
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: Test
          include: true
    integrations:
      app_store_connect: bar_fest_test_apple_api
    max_build_duration: 120
    instance_type: mac_mini_m1
    environment:
      groups:
        - bar_fest_distribution
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.barfest.app.test
      vars:
        XCODE_PROJECT: "native/ios/BarFest/BarFest.xcodeproj"
        XCODE_SCHEME: "BarFest"
        BUNDLE_ID: "com.barfest.app.test"
      xcode: latest
    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen || true
      - name: Generate Xcode project (test bundle id)
        script: |
          cd native/ios/BarFest
          # Point the generated project at Bar Fest Test before xcodegen runs.
          sed -i.bak 's/PRODUCT_BUNDLE_IDENTIFIER: com.barfest.app$/PRODUCT_BUNDLE_IDENTIFIER: com.barfest.app.test/' project.yml
          # Green home-screen icon for TestFlight test app (prod keeps AppIcon / black).
          sed -i.bak 's/ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon$/ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon-Test/' project.yml
          rm -f project.yml.bak
          xcodegen generate
          git checkout HEAD -- BarFest/Info.plist
          # Restore project.yml so the workspace clone stays clean for later steps that read it
          git checkout HEAD -- project.yml
      - name: Restore Info.plist + test flags + inject secrets
        script: |
          PLIST=native/ios/BarFest/BarFest/Info.plist
          PBX=native/ios/BarFest/BarFest.xcodeproj/project.pbxproj
          # Ensure generated project uses test bundle id (xcodegen already did; re-assert if needed)
          if [ -f "$PBX" ]; then
            sed -i.bak "s/PRODUCT_BUNDLE_IDENTIFIER = [^;]*/PRODUCT_BUNDLE_IDENTIFIER = ${BUNDLE_ID}/g" "$PBX"
            sed -i.bak "s/ASSETCATALOG_COMPILER_APPICON_NAME = AppIcon;/ASSETCATALOG_COMPILER_APPICON_NAME = AppIcon-Test;/g" "$PBX"
            rm -f "${PBX}.bak"
          fi
          NATIVE_MARKETING_VERSION=1.0.1
          # Independent of production Bar Fest build numbers — keep in sync with Info.plist
          NATIVE_BUILD_NUMBER=33
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${NATIVE_MARKETING_VERSION}" "$PLIST" || \
            /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string ${NATIVE_MARKETING_VERSION}" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${NATIVE_BUILD_NUMBER}" "$PLIST" || \
            /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string ${NATIVE_BUILD_NUMBER}" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleIconName AppIcon-Test" "$PLIST" || \
            /usr/libexec/PlistBuddy -c "Add :CFBundleIconName string AppIcon-Test" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :ITSAppUsesNonExemptEncryption" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :ENABLE_DEV_TEST_MODE_UI" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :ENABLE_DEV_TEST_MODE_UI bool true" "$PLIST"
          test "$(/usr/libexec/PlistBuddy -c 'Print :ENABLE_DEV_TEST_MODE_UI' "$PLIST")" = "true"
          /usr/libexec/PlistBuddy -c "Set :VITE_SUPABASE_URL ${VITE_SUPABASE_URL}" "$PLIST" || \
            /usr/libexec/PlistBuddy -c "Add :VITE_SUPABASE_URL string ${VITE_SUPABASE_URL}" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :VITE_SUPABASE_PUBLISHABLE_KEY ${VITE_SUPABASE_PUBLISHABLE_KEY}" "$PLIST" || \
            /usr/libexec/PlistBuddy -c "Add :VITE_SUPABASE_PUBLISHABLE_KEY string ${VITE_SUPABASE_PUBLISHABLE_KEY}" "$PLIST"
          echo "BUNDLE_ID=${BUNDLE_ID}"
          echo "Info.plist CFBundleVersion=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$PLIST")"
          echo "CFBundleIconName=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconName' "$PLIST")"
          echo "ENABLE_DEV_TEST_MODE_UI=$(/usr/libexec/PlistBuddy -c 'Print :ENABLE_DEV_TEST_MODE_UI' "$PLIST")"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$PLIST")" = "${NATIVE_BUILD_NUMBER}"
          grep -m1 PRODUCT_BUNDLE_IDENTIFIER "$PBX" || true
          grep -m1 ASSETCATALOG_COMPILER_APPICON_NAME "$PBX" || true
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles
      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
